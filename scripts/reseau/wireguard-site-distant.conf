# =============================================================================
#  HydroRegie - Tunnel WireGuard d'un site distant (zone Z8)
#  Projet NIS2 - bloc 3
#  Version 1.0 - 2026-09-10
#
#  CONTEXTE : les reservoirs et stations de relevage communiquent en 4G sur un
#  APN prive. L'APN prive isole d'Internet mais NE CHIFFRE PAS de bout en bout
#  et ne protege pas d'un equipement voisin compromis sur le meme APN.
#  -> chaque site monte donc son propre tunnel, avec SA PROPRE CLE.
# =============================================================================


# =============================================================================
#  PARTIE 1 - COTE SITE DISTANT  (RTU du reservoir Nord)
#  Fichier : /etc/wireguard/wg0.conf   (droits 600, proprietaire root)
# =============================================================================

[Interface]
# Cle privee du site - JAMAIS partagee, JAMAIS commitee dans un depot
PrivateKey = <cle-privee-reservoir-nord>
Address    = 10.230.1.12/32
ListenPort = 51820

# Le site n'a pas d'adresse publique fixe : il initie toujours la connexion.
# On ne peut donc pas l'attaquer depuis l'exterieur en se connectant a lui.

[Peer]
# Concentrateur VPN au siege
PublicKey  = <cle-publique-concentrateur>
Endpoint   = <adresse-publique-concentrateur>:51820
# Seul le reseau de supervision est joignable depuis ce site.
# On ne pousse PAS 10.0.0.0/8 : le site n'a rien a faire ailleurs.
AllowedIPs = 10.210.0.0/24
# Maintient le tunnel ouvert a travers le NAT de l'operateur
PersistentKeepalive = 25


# =============================================================================
#  PARTIE 2 - COTE CONCENTRATEUR  (siege, zone Z9)
#  Fichier : /etc/wireguard/wg0.conf
# =============================================================================
#
# [Interface]
# PrivateKey = <cle-privee-concentrateur>
# Address    = 10.230.0.1/22
# ListenPort = 51820
#
# # --- Un bloc [Peer] PAR SITE, avec une cle propre a chaque site ---
#
# [Peer]
# # Reservoir Nord
# PublicKey  = <cle-publique-reservoir-nord>
# AllowedIPs = 10.230.1.12/32        # <<<< /32 : UN SEUL hote autorise
# PersistentKeepalive = 25
#
# [Peer]
# # Station de relevage Est
# PublicKey  = <cle-publique-station-est>
# AllowedIPs = 10.230.1.13/32
# PersistentKeepalive = 25
#
# ... un bloc par site (environ 60 sites)


# =============================================================================
#  LE POINT QUI COMPTE : AllowedIPs en /32
# =============================================================================
#
#  AllowedIPs = 10.230.1.12/32   -> le site ne peut envoyer QUE depuis cette IP
#  AllowedIPs = 10.230.0.0/22    -> ERREUR FREQUENTE : un site compromis
#                                   pourrait usurper l'adresse de n'importe
#                                   quel autre site du parc.
#
#  Cote WireGuard, AllowedIPs sert a la fois de table de routage ET de filtre
#  de source (cryptokey routing). C'est donc une regle de securite, pas
#  seulement une route.
# =============================================================================


# =============================================================================
#  GENERATION DES CLES  (une paire par site, jamais de cle partagee)
# =============================================================================
#
#  umask 077
#  wg genkey | tee reservoir-nord.key | wg pubkey > reservoir-nord.pub
#
#  -> reservoir-nord.key : cle privee, reste sur le RTU
#  -> reservoir-nord.pub : cle publique, a declarer sur le concentrateur
#
#  Les cles privees ne sont JAMAIS commitees. Elles sont stockees dans le
#  coffre a secrets, et l'inventaire trace quelle cle correspond a quel site.
# =============================================================================


# =============================================================================
#  MISE EN SERVICE ET VERIFICATION
# =============================================================================
#
#  sudo systemctl enable --now wg-quick@wg0
#
#  # Le tunnel est-il monte ?
#  sudo wg show
#    -> "latest handshake" doit dater de moins de 2 minutes
#    -> "transfer" doit augmenter
#
#  # La supervision est-elle joignable ?
#  ping -c 3 10.210.0.10
#
#  # Le site NE DOIT PAS pouvoir joindre autre chose :
#  ping -c 2 10.110.0.10     # bureautique  -> doit ECHOUER
#  ping -c 2 8.8.8.8         # Internet     -> doit ECHOUER
#
#  # Rotation des cles : une fois par an, ou immediatement en cas de
#  # remplacement de materiel ou de suspicion de compromission du site.
# =============================================================================
