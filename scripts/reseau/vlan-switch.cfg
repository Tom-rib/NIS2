! ============================================================================
!  HydroRegie - Configuration type d'un commutateur d'acces
!  Projet NIS2 - bloc 3 : segmentation IT / OT
!  Syntaxe de type Cisco IOS - a adapter au constructeur reellement deploye
!  Version 1.0 - 2026-09-10
! ============================================================================
!
!  RAPPEL : un VLAN n'est PAS une mesure de securite a lui seul.
!  Il organise le reseau ; c'est le PARE-FEU qui protege.
!  Voir Cour/technique/03-vlan-et-segmentation.md
!
! ============================================================================

hostname SW-USINE-NORD-01

! ---------------------------------------------------------------------------
! 1. Creation des VLAN
!    Convention : le numero de VLAN correspond au 2e octet du reseau
!    (VLAN 210 -> 10.210.x.x). En crise, on lit une IP et on sait ou on est.
! ---------------------------------------------------------------------------
vlan 100
 name Z1-EXPOSITION
vlan 110
 name Z2-IT-BUREAUTIQUE
vlan 120
 name Z3-IT-METIER
vlan 130
 name Z4-SAUVEGARDE
vlan 200
 name Z5-DMZ-INDUSTRIELLE
vlan 210
 name Z6-SUPERVISION-OT
vlan 220
 name Z7-CONTROLE-OT
vlan 230
 name Z8-SITES-DISTANTS
vlan 240
 name Z9-ADMINISTRATION
vlan 999
 name VLAN-NATIF-INUTILISE

! ---------------------------------------------------------------------------
! 2. Port d'acces - AUTOMATE (zone Z7)
!    Le durcissement est ici plus important que la configuration elle-meme.
! ---------------------------------------------------------------------------
interface GigabitEthernet0/5
 description AUTOMATE Station de relevage Nord - M340 - 10.220.10.15
 switchport mode access
 switchport access vlan 220
 switchport nonegotiate                    ! interdit la negociation de trunk (anti switch spoofing)
 switchport port-security                  ! limite les adresses MAC apprises
 switchport port-security maximum 1        ! un seul equipement par port
 switchport port-security violation restrict
 switchport port-security mac-address sticky
 spanning-tree portfast
 spanning-tree bpduguard enable            ! desactive le port si un commutateur pirate est branche
 no cdp enable                             ! pas de divulgation d'informations
 storm-control broadcast level 5.00
 no shutdown

! ---------------------------------------------------------------------------
! 3. Port d'acces - POSTE BUREAUTIQUE (zone Z2)
! ---------------------------------------------------------------------------
interface GigabitEthernet0/10
 description POSTE BUREAUTIQUE - service facturation
 switchport mode access
 switchport access vlan 110
 switchport nonegotiate
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! ---------------------------------------------------------------------------
! 4. Port d'acces - SUPERVISEUR SCADA (zone Z6)
! ---------------------------------------------------------------------------
interface GigabitEthernet0/2
 description SUPERVISEUR SCADA principal - 10.210.0.10
 switchport mode access
 switchport access vlan 210
 switchport nonegotiate
 switchport port-security
 switchport port-security maximum 1
 switchport port-security violation restrict
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown

! ---------------------------------------------------------------------------
! 5. Port MIROIR pour la sonde de detection PASSIVE
!    La sonde ecoute une copie du trafic. Elle n'emet rien vers l'OT.
! ---------------------------------------------------------------------------
monitor session 1 source vlan 210 , 220 both
monitor session 1 destination interface GigabitEthernet0/22
!
interface GigabitEthernet0/22
 description SONDE DE DETECTION PASSIVE - port miroir - RECEPTION SEULE
 no shutdown

! ---------------------------------------------------------------------------
! 6. Lien montant (trunk) vers le pare-feu OT
!    Regle : un trunk ne transporte QUE ce dont il a besoin.
! ---------------------------------------------------------------------------
interface GigabitEthernet0/24
 description TRUNK vers FW-OT-01
 switchport mode trunk
 switchport trunk allowed vlan 200,210,220,230    ! liste EXPLICITE - jamais "all"
 switchport trunk native vlan 999                 ! VLAN natif inutilise et non route (anti double tagging)
 switchport nonegotiate
 no cdp enable
 no shutdown

! ---------------------------------------------------------------------------
! 7. Desactivation de TOUS les ports inutilises
!    Un port libre dans un local technique est une porte d'entree.
! ---------------------------------------------------------------------------
interface range GigabitEthernet0/11 - 21
 description PORT INUTILISE
 switchport mode access
 switchport access vlan 999
 shutdown

! ---------------------------------------------------------------------------
! 8. Administration : depuis la zone Z9 UNIQUEMENT
! ---------------------------------------------------------------------------
interface Vlan240
 description Interface d'administration
 ip address 10.240.1.11 255.255.255.0
 no shutdown

ip access-list standard ACL-ADMIN
 permit 10.240.0.5                          ! bastion d'administration
 deny   any log

line vty 0 15
 access-class ACL-ADMIN in
 transport input ssh                        ! SSH uniquement - Telnet interdit
 exec-timeout 10 0
 login local

no ip http server                           ! pas d'administration web en clair
ip ssh version 2

! ---------------------------------------------------------------------------
! 9. Journalisation et horloge
!    L'horloge est le detail qui tue : une chronologie de crise construite sur
!    des equipements desynchronises est inexploitable.
! ---------------------------------------------------------------------------
ntp server 10.240.0.30
ntp server 10.240.0.31
clock timezone CET 1
clock summer-time CEST recurring last Sun Mar 2:00 last Sun Oct 3:00
!
logging host 10.240.0.20 transport tcp port 6514
logging trap informational
logging source-interface Vlan240
service timestamps log datetime msec localtime show-timezone

! ---------------------------------------------------------------------------
! 10. Verifications a faire apres application
! ---------------------------------------------------------------------------
!  show vlan brief                  -> les VLAN existent et les ports sont bien affectes
!  show interfaces trunk            -> le trunk ne transporte que la liste voulue
!  show interfaces status           -> les ports inutilises sont bien "disabled"
!  show port-security               -> le nombre d'adresses MAC est limite
!  show ntp status                  -> l'horloge est synchronisee
!  show logging                     -> les journaux partent bien vers 10.240.0.20
! ============================================================================
