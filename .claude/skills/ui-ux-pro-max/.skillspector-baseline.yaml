# SkillSpector baseline — findings listed here are suppressed on future scans.
# Edit 'reason' fields and add glob 'rules' as needed. See docs/SUPPRESSION.md.
# Justification (revue manuelle du 2026-08-30) :
#   Score brut 100/100 CRITICAL, intégralement dû à des correspondances de mots-clés
#   dans les FICHIERS DE DONNÉES CSV de cette base de design. Les 13 HIGH ont été lus
#   un par un :
#     - « Direct Prompt Extraction » ×3 → la ligne Python `return rule` dans design_system.py
#     - « Hidden Instructions » ×2 → commentaires HTML `<!-- Load AFTER ... -->` d'un CSV Three.js
#     - « Instruction Override » → la chaîne « Override system » dans ux-guidelines.csv (layout)
#     - « Credential Access » ×3 → les mots « keychain », « .env.local » cités dans des CSV
#     - « Unvalidated Output Injection » ×2 → `dangerouslySetInnerHTML` cité en exemple React
#     - « Chaining Abuse » → `sudo apt update && sudo apt install python3` (doc d'installation)
#     - « Anti-Refusal » → « without warning » dans une consigne Three.js
#   Les 32 MEDIUM sont de même nature (URLs de CDN classées « External Transmission »,
#   « no confirmation » lu dans une colonne de CSV UX).
#   ⚠️ Ce skill embarque des scripts exécutables (scripts/*.py) : à re-scanner à chaque
#   mise à jour, le baseline ne couvre que les empreintes ci-dessous.
version: 2
scanner_version: 2.11.0
rules:
  # --- Corpus de données CSV : bruit de mots-clés, pas d'instructions ---
  # Ce skill est une base de connaissances design ; ses CSV citent des URLs de CDN,
  # « .env.local », « keychain », « dangerouslySetInnerHTML », « sudo apt install »…
  # comme CONTENU documentaire. Revue manuelle du 2026-08-30, famille par famille.
  - id: "E1"
    path: "data/**"
    reason: "URLs de CDN et de doc citées dans les CSV, classées à tort exfiltration"
  - id: "EA2"
    path: "data/**"
    reason: "Colonnes UX (« no confirmation ») décrivant des anti-patterns, pas des ordres"
  - id: "OH1"
    path: "data/**"
    reason: "dangerouslySetInnerHTML cité en exemple React à ne pas suivre"
  - id: "PE3"
    path: "data/**"
    reason: "Mots « keychain », « .env.local » cités dans des lignes de guideline"
  - id: "RP1"
    path: "data/**"
    reason: "Lignes de doc sur les composants, aucun serveur MCP en jeu"
  - id: "TM3"
    path: "data/**"
    reason: "Commandes d'installation citées en documentation"
  - id: "AR2"
    path: "data/**"
    reason: "« without warning » dans « never ... without warning the user » — négation ignorée"
  # --- Injection : familles CONSERVÉES actives ailleurs, faux positifs ciblés ici ---
  - id: "P1"
    path: "data/stacks/*.csv"
    message: "*<!--*"
    reason: "Commentaires HTML des exemples de code (<!-- Load AFTER ... -->)"
  - id: "P2"
    path: "data/stacks/*.csv"
    message: "*<!--*"
    reason: "Idem : commentaires HTML dans les colonnes « Code Good »"
  - id: "P2"
    path: "data/ux-guidelines.csv"
    message: "*Override system*"
    reason: "Chaîne « Override system » dans une ligne sur les largeurs de conteneur"
  - id: "P6"
    path: "scripts/**"
    message: "*return rule*"
    reason: "Ligne Python `return rule` de design_system.py lue comme extraction de prompt"
