# SkillSpector baseline — les findings listés ici sont supprimés des scans suivants.
# Scan initial du 2026-09-08 (mode statique --no-llm) : 23 findings, score 74/100 HIGH.
# Les 5 HIGH ont été ouverts et lus un par un. Verdict : faux positifs, deux familles.
#
# ── P2 « Hidden Instructions » + YR4 « MCP tool poisoning metadata » ──────────
#   assets/template.html:34, 4852, 5104 et renderers/shared/utils.mjs:12.
#   Le motif matche la syntaxe de commentaire HTML `<!-- ... -->`. Contenu réel :
#     :34   « Async font load: a blackholed network must not block first paint. »
#     :4852 « Toolbar: theme, live visual style, trace motion… T toggles theme… »
#     :5104 « ARROW EXAMPLES (use .a-* classes and stroke-width on the line) »
#     utils.mjs:12 → `<!-- Definitions -->` dans un littéral de gabarit qui génère du SVG.
#   Ce sont des commentaires de développeur ordinaires. Aucune instruction adressée
#   à un agent, aucun caractère invisible.
#
# ── RA2 « Session Persistence » ──────────────────────────────────────────────
#   assets/template.html:7437, 8111, 8205, 8368, 8373. Les cinq lignes manipulent
#   la variable `relationshipList`, un simple `<ul>` du panneau « lentille sémantique »
#   (getElementById, querySelectorAll, appendChild, textContent = ''). Ni cron, ni
#   script de démarrage, ni fichier d'état, ni stockage navigateur.
#
# ── Audit manuel complémentaire sur assets/template.html (le HTML livré) ──────
#   Recherché explicitement, car c'est un artefact autonome destiné à être partagé :
#     fetch( / XMLHttpRequest / sendBeacon / WebSocket / import()  → aucun
#     eval( / new Function( / innerHTML =                          → aucun
#     new Image() ×3                                               → rastérisation
#       SVG→canvas pour l'export PNG et la share card, pas de balise-espion
#     hôtes externes → uniquement www.w3.org (espaces de noms SVG, jamais requêtés)
#       et fonts.googleapis.com / fonts.gstatic.com (chargement de police asynchrone)
#   ⚠️ Résidu assumé, pas un faux positif : le HTML généré appelle Google Fonts.
#      Quiconque OUVRE un diagramme exporté est donc vu par Google. Repli prévu sur
#      la pile monospace système si le réseau est coupé. À savoir avant de diffuser
#      un diagramme hors de l'organisation ; documenté dans docs/guide-archify.md.
#
# ── SC1 « Unpinned Dependencies » package.json:29 ─────────────────────────────
#   `ajv`, `simple-icons`, `parse5`, `saxes` sont en **devDependencies** seulement.
#   Vérifié : `bin/archify.mjs` n'importe QUE des modules natifs (node:fs, node:path,
#   node:crypto, node:child_process, node:os, node:url). Les validateurs sont
#   pré-compilés dans le dépôt. Aucun `npm install` n'est requis pour s'en servir,
#   donc la plage de versions n'est jamais résolue à l'exécution.
#
# ── Volontairement NON supprimé (on ne muselle pas l'outil) ───────────────────
#   LP3 « Skill declares no tool scope » SKILL.md:1 → constat réel, pas un faux
#   positif : le skill amont ne déclare pas d'`allowed-tools`. On ne patche pas le
#   SKILL.md amont, pour ne pas casser les montées de version. Le garde-fou est en
#   aval, dans `.claude/settings.json` : seul `node .claude/skills/archify/bin/
#   archify.mjs` est pré-autorisé, et `ARCHIFY_UPDATE_CHECK_DISABLED=1` coupe le
#   rappel de mise à jour automatique décrit dans SKILL.md § « Update awareness ».
#
# Règles glob plutôt qu'empreintes : les fingerprints se sont révélées instables
# d'un scan à l'autre sur les skills riches en données (leçon du 2026-08-30).
version: 2
scanner_version: 2.11.0
rules:
  - id: P2
    path: assets/template.html
    message: "Commentaires HTML de developpeur (chargement police, raccourcis clavier, exemples de fleches) — lus un par un"
  - id: P2
    path: renderers/shared/utils.mjs
    message: "<!-- Definitions --> dans un litteral de gabarit generant du SVG"
  - id: YR4
    path: assets/template.html
    message: "Meme commentaire HTML ligne 34 que P2 — aucun outil offensif, aucune metadonnee MCP"
  - id: RA2
# Empreintes générées par : skillspector baseline .claude/skills/archify --no-llm
